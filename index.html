<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A2E">
<meta name="description" content="KMP — личный музыкальный плеер с микшером эффектов и лентой моментов">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KMP">
<title>KMP Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{overscroll-behavior-y:none}</style>
</head>
<body>
<title>KMP Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E9EDF2;--surface:rgba(255,255,255,.72);--surface-2:#F4F6F9;
  --ink:#131826;--ink-2:#394154;--muted:#667085;
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.84);--glass-line:rgba(255,255,255,.7);
  --line:rgba(19,24,38,.09);--hover:rgba(19,24,38,.05);
  --accent:#E8552B;--accent-2:#F7774F;--on-accent:#fff;
  --deep:#161A2E;--on-deep:#fff;
  --wave:rgba(19,24,38,.2);--wave-hi:rgba(232,85,43,.42);
  --shadow:0 1px 2px rgba(19,24,38,.05),0 14px 34px -18px rgba(19,24,38,.3);
  --shadow-lg:0 40px 90px -34px rgba(19,24,38,.5);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --f-display:'Outfit',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B0E15;--surface:#131722;--surface-2:#181D2A;--ink:#EDF0F6;--ink-2:#C3C9D5;--muted:#8B93A6;
    --glass:rgba(20,24,36,.55);--glass-strong:rgba(22,27,40,.86);--glass-line:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);
    --accent:#FF6A3C;--accent-2:#FF8C66;--deep:#EDF0F6;--on-deep:#131826;
    --wave:rgba(237,240,246,.2);--wave-hi:rgba(255,106,60,.45);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.7);--shadow-lg:0 40px 90px -34px rgba(0,0,0,.85);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B0E15;--surface:#131722;--surface-2:#181D2A;--ink:#EDF0F6;--ink-2:#C3C9D5;--muted:#8B93A6;
  --glass:rgba(20,24,36,.55);--glass-strong:rgba(22,27,40,.86);--glass-line:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);
  --accent:#FF6A3C;--accent-2:#FF8C66;--deep:#EDF0F6;--on-deep:#131826;
  --wave:rgba(237,240,246,.2);--wave-hi:rgba(255,106,60,.45);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.7);--shadow-lg:0 40px 90px -34px rgba(0,0,0,.85);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
img{display:block;max-width:100%}
.ic{width:20px;height:20px;flex:none;display:inline-block}
.ic-pause{display:none}
body.is-playing .gp .ic-play,body.is-playing .current .ic-play{display:none}
body.is-playing .gp .ic-pause,body.is-playing .current .ic-pause{display:inline-block}
.num{font-variant-numeric:tabular-nums}
.glass-strong{background:var(--glass-strong);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.press{transition:transform .45s var(--spring),background-color .2s,color .2s}
.press:active{transform:scale(.93)}

/* shell */
.app{display:grid;grid-template-columns:60px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto;padding-block:16px 124px;padding-inline:16px}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));z-index:30;align-self:start;display:flex;flex-direction:column;gap:12px;view-transition-name:rail}
.rail-pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px;border-radius:30px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--deep);color:var(--on-deep);border:1px solid var(--line);transition:background .4s,color .4s;display:grid;place-items:center;font:600 19px/1 var(--f-display);letter-spacing:-.04em;box-shadow:var(--shadow)}
.logo i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.nav-btn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.nav-btn:hover{color:var(--ink);background:var(--hover)}
.nav-btn[aria-current="page"]{background:var(--deep);color:var(--on-deep)}
.nav-btn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--deep);color:var(--on-deep);font:600 12px/1 var(--f-body);padding:8px 10px;border-radius:9px;pointer-events:none;z-index:5}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}

.topbar{display:flex;align-items:center;gap:12px;view-transition-name:topbar}
.pill{height:54px;padding:0 22px;border-radius:27px;display:inline-flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.pill-ghost{background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.pill-accent{background:var(--accent);color:var(--on-accent)}
.pill-accent:hover{background:var(--accent-2)}
.search-pill{flex:1;min-width:0;height:54px;border-radius:27px;display:flex;align-items:stretch;padding:0 6px}
.seg{display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0;cursor:text;border-radius:22px;margin-block:5px}
.seg+.seg{border-left:1px solid var(--line);border-radius:0 22px 22px 0}
.seg:hover{background:var(--hover)}
.seg-search{flex:1}
.seg .ic{color:var(--muted);width:18px;height:18px}
.seg-text{display:flex;flex-direction:column;min-width:0;flex:1}
.seg small{font-size:11px;font-weight:600;color:var(--muted);line-height:1.1}
.seg input,.seg select{border:0;background:transparent;outline:none;font-weight:600;font-size:14px;padding:1px 0 0;min-width:0;width:100%;-webkit-appearance:none;appearance:none;cursor:pointer}
.seg input{cursor:text}
.seg input::placeholder{color:var(--muted);font-weight:500}
.seg select option{color:#131826;background:#fff}

/* stage: home now-playing */
.stage{position:relative;isolation:isolate;overflow:hidden;border-radius:32px;min-height:clamp(540px,72vh,700px);display:grid;grid-template-rows:auto 1fr auto auto;gap:28px;padding:26px 32px 30px;color:#fff;background:#1d2236;box-shadow:var(--shadow-lg);text-shadow:0 1px 24px rgba(0,0,0,.18)}
.stage .bg,.full .bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.greet{margin:0;font-weight:600;font-size:15px}
.st-actions{display:flex;gap:8px;flex-wrap:wrap}
.st-btn{height:42px;min-width:42px;padding:0 12px;border-radius:21px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:13px;color:#fff;text-shadow:none}
.st-btn:hover{background:rgba(255,255,255,.26)}
.st-btn .ic{width:18px;height:18px}
.st-btn.like-on{color:#fff;background:rgba(255,255,255,.3)}
.st-main{grid-row:3;display:flex;align-items:flex-end;gap:28px;min-width:0}
.st-cover{width:clamp(130px,15vw,200px);aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 30px 60px -22px rgba(0,0,0,.6);flex:none;background:rgba(255,255,255,.1)}
.st-text{min-width:0}
.st-kick{margin:0 0 8px;font-weight:600;font-size:13px;opacity:.8}
.st-title{margin:0;font:300 clamp(44px,6.6vw,104px)/.95 var(--f-display);letter-spacing:-.045em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:.08em;overflow-wrap:anywhere}
.st-artist{margin:10px 0 0;font-weight:600;font-size:clamp(16px,1.5vw,20px)}
.st-meta{margin:4px 0 0;font-size:13px;opacity:.75}
.st-bottom{grid-row:4;display:flex;align-items:center;gap:22px}
.st-ctrl{display:flex;align-items:center;gap:4px}
.st-ctrl .cbtn{color:#fff}
.st-ctrl .cbtn:hover{background:rgba(255,255,255,.16);color:#fff}
.st-play{width:62px;height:62px;border-radius:50%;background:#fff;color:#131826;display:grid;place-items:center;position:relative;margin-inline:6px;transition:transform .45s var(--spring)}
.st-play:hover{transform:scale(1.06)}.st-play:active{transform:scale(.93)}
.st-play .ic{width:26px;height:26px;grid-area:1/1}
.st-wave{flex:1;display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;min-width:0}
.st-wave .wave{height:56px}

/* sections */
.block{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-inline:4px}
.block-head h2{margin:0;font:400 26px/1.1 var(--f-display);letter-spacing:-.02em}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
.link:hover{color:var(--ink)}
.link .ic{width:16px;height:16px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(148px,14vw,184px);gap:18px;overflow-x:auto;padding:4px 4px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.card{text-align:left;display:flex;flex-direction:column;gap:2px;scroll-snap-align:start;min-width:0}
.card-cov{position:relative;display:block;border-radius:18px;overflow:hidden;aspect-ratio:1;max-width:100%;margin-bottom:10px;transition:transform .5s var(--ease)}
.card-cov img{width:100%;height:100%;object-fit:cover}
.card:hover .card-cov{transform:translateY(-4px)}
.card-play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:#fff;color:#131826;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .45s var(--ease);box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.card:hover .card-play,.card:focus-visible .card-play,.card.current .card-play{opacity:1;transform:none}
.card b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card>span:last-child{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.current b{color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{display:flex;align-items:center;gap:14px;padding:10px;border-radius:20px;text-align:left;background:var(--surface);border:1px solid var(--line);transition:background .2s}
.pcard:hover{background:var(--surface-2)}
.pcard b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{display:block;font-size:12.5px;color:var(--muted)}
.pcard .txt{min-width:0}
.mosaic{width:64px;height:64px;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;flex:none;background:var(--hover)}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic.one{grid-template-columns:1fr}
.mosaic.lg{width:150px;height:150px;border-radius:24px}
.liked-cov{display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#F58E63,var(--accent) 60%,#C23B4C)}
.mosaic.lg.liked-cov .ic{width:54px;height:54px}
.empty-cov,.new-cov{display:grid;place-items:center;color:var(--muted)}
.new-cov{border:1.5px dashed var(--wave);background:transparent}
.dropline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 20px;border:1.5px dashed var(--wave);border-radius:22px;color:var(--ink-2)}
.dropline p{margin:0;max-width:60ch}
.dropline b{color:var(--ink)}

/* pages */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:12px 4px 4px}
.ph-l{display:flex;align-items:flex-end;gap:22px;min-width:0}
.crumb{margin:0;font-weight:600;font-size:13px;color:var(--muted)}
.h1{margin:4px 0 0;font:300 clamp(40px,5vw,64px)/1 var(--f-display);letter-spacing:-.04em;overflow-wrap:anywhere}
.sub{margin:8px 0 0;color:var(--muted);font-weight:600;font-size:13.5px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:22px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:18px;height:18px}
.btn-accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-accent:hover{background:var(--accent-2)}
.btn-danger{color:#C9352D}
.btn.armed{background:#C9352D;color:#fff;border-color:transparent}
.btn.holding{background:var(--deep);color:var(--on-deep)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-inline:4px}
.chip{height:34px;padding:0 15px;border-radius:17px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:transparent}

.list{border-radius:24px;padding:6px;background:var(--surface);border:1px solid var(--line)}
.lhead,.row{display:grid;grid-template-columns:34px 46px minmax(0,1fr) 120px 40px 52px 40px;gap:14px;align-items:center;padding:7px 12px}
.lhead{font-size:12px;font-weight:600;color:var(--muted);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lhead span:nth-child(6){text-align:right}
.row{border-radius:14px;cursor:pointer;transition:background .15s}
.row:hover{background:var(--hover)}
.row.current{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.r-idx{display:grid;place-items:center;height:24px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.r-idx>*{grid-area:1/1}
.r-idx .ic{width:16px;height:16px;visibility:hidden;color:var(--ink)}
.row:hover .r-idx .n,.row.current .r-idx .n{visibility:hidden}
.row:hover .r-idx .ic-play{visibility:visible}
.eq{display:none;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;height:40%;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.row.current .eq{display:flex}
body.is-playing .row.current .eq i{animation-play-state:running}
.row.current:hover .eq{display:none}
.row.current:hover .r-idx .ic-pause{visibility:visible}
.r-cov{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--hover)}
.r-meta{min-width:0}
.r-t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.current .r-t{color:var(--accent)}
.r-a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tag{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.r-btn:hover{background:var(--line);color:var(--ink)}
.r-btn .ic{width:18px;height:18px}
.r-btn[aria-pressed="true"]{color:var(--accent)}
.r-d{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.empty{padding:44px 24px;text-align:center;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--wave)}
.empty h3{margin:0;font:400 24px/1.1 var(--f-display)}
.empty p{margin:0;color:var(--muted);max-width:44ch}

/* feed */
.feed{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start;margin-top:14px}
.feed-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.feed-side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
.card-s{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card-s h3{margin:0;font:500 17px/1.2 var(--f-display)}
.card-s p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.field{height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:15px;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
.composer-open{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--muted);font-size:14.5px}
.composer-open:hover{background:var(--surface-2)}
.composer-open img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.composer-open span{flex:1;min-width:0}
.post{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.p-head{display:flex;align-items:center;gap:10px;min-width:0}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:500 15px/1 var(--f-display);color:#fff;flex:none;text-transform:uppercase}
.p-who{min-width:0;flex:1}
.p-who b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-who span{font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;background:var(--hover);color:var(--muted)}
.p-text{margin:0;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.p-track{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.p-track img{width:52px;height:52px;border-radius:11px;object-fit:cover;background:var(--hover)}
.p-track .r-t{font-size:14px}
.p-cv{grid-column:1/-1;height:38px;width:100%;display:block}
.mom-btn{height:36px;padding:0 14px;border-radius:18px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.mom-btn .ic{width:16px;height:16px}
.mom-btn.playing{background:var(--deep);color:var(--on-deep)}
.mom-btn[disabled]{background:var(--hover);color:var(--muted);cursor:default}
.mood{display:inline-flex;height:26px;padding:0 10px;border-radius:13px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:12px;font-weight:700;align-items:center;align-self:flex-start}
.p-actions{display:flex;gap:4px;margin:-4px 0 -6px -8px}
.p-actions button{height:34px;padding:0 10px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.p-actions button:hover{background:var(--hover);color:var(--ink)}

  .snd-k{align-self:end;margin-top:4px}
  .snd-d{font-size:13px;margin-top:4px;grid-column:1/-1!important}
  .snd-act{grid-column:1/-1}
  .mix-hint{display:none}
  .sm-t small{font-size:12px;line-height:1.35}
  .snd-act .st-btn span{display:none}
  .snd-act{margin-top:12px}
  .plist{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:144px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 10px;scrollbar-width:none}
  .plist::-webkit-scrollbar{display:none}
  .pc{scroll-snap-align:start}
  .seg-tabs{margin-inline:-16px;border-radius:0;padding:4px 16px;background:transparent;max-width:none;align-self:stretch;width:auto}
  .seg-tabs button{background:var(--hover)}
  .console.one.is-eq{grid-template-columns:1fr}
  .mp-out{display:none}
  .knobs.big{grid-template-columns:repeat(3,minmax(0,1fr))}
  .knobs.big .knob svg{width:66px;height:66px}
  .sm-row{padding:12px 14px;gap:12px}
  .sm-ic{width:36px;height:36px;border-radius:11px}
  /* floating tab bar + mini player */
  :root{--tabh:62px;--barh:60px}
  .app{padding-bottom:calc(var(--tabh) + var(--barh) + 44px + env(safe-area-inset-bottom,0px))}
  .tabbar{left:10px!important;right:10px!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;height:var(--tabh)!important;padding:5px!important;border-radius:24px!important;border:1px solid var(--line)!important;background:var(--surface-2)!important;box-shadow:0 12px 32px -14px rgba(0,0,0,.45)!important}
  .tabbar button{border-radius:19px;gap:3px;font-size:10.5px;transition:background .25s,color .25s}
  .tabbar button .ic{width:21px;height:21px;transition:transform .35s var(--spring)}
  .tabbar button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
  .tabbar button[aria-current="page"] .ic{transform:translateY(-1px) scale(1.08)}
  .player{left:10px!important;right:10px!important;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px))!important;height:var(--barh)!important;border-radius:18px!important;border:1px solid var(--line)!important;box-shadow:0 12px 30px -16px rgba(0,0,0,.45)!important;overflow:hidden!important;padding:7px 8px 7px 7px!important}
  .p-line{top:auto!important;bottom:0!important;height:2px!important}
  .p-cover{width:44px!important;height:44px!important;border-radius:11px!important}
  .toast{bottom:calc(var(--tabh) + var(--barh) + 30px + env(safe-area-inset-bottom,0px))!important}
  .focus-pill{bottom:calc(var(--tabh) + var(--barh) + 76px + env(safe-area-inset-bottom,0px))!important}
  /* menus become bottom sheets */
  .menu.as-sheet{left:0!important;right:0!important;top:auto!important;bottom:0;width:auto;max-width:none;max-height:78dvh;border-radius:24px 24px 0 0;padding:6px 10px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface-2);box-shadow:0 -12px 40px -10px rgba(0,0,0,.4);animation:sheetUp .32s var(--ease)}
  .menu.as-sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--wave);margin:6px auto 8px;flex:none}
  .menu.as-sheet button{padding:13px 12px;font-size:15px;border-radius:14px}
  .menu.as-sheet button .ic{width:19px;height:19px}
  .menu.as-sheet .m-label{font-size:13px;margin:6px 12px}
}
/* smart features */
.smart{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-top b{font:500 16px/1.2 var(--f-display)}
.tile p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.tile p strong{color:var(--ink);font-weight:600}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--wave);flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.sel{height:34px;border-radius:17px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;flex:none}
.full .sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:#fff}
.full .sel option{color:#131826}
.f-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool{height:34px;min-width:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:13px;color:#fff}
.tool:hover{background:rgba(255,255,255,.26)}
.tool[aria-pressed="true"]{background:#fff;color:#131826}
.tool-note{font-size:12.5px;opacity:.75;margin-left:4px}
.p-more{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.p-more .ic{width:16px;height:16px}
.p-more:hover{background:var(--line);color:var(--ink)}
.preset.user{padding-right:36px}
.net-tabs{display:flex;gap:8px;flex-wrap:wrap}
.net-tabs .chip{height:auto;padding:8px 14px;text-align:left;display:flex;flex-direction:column;border-radius:14px}
.net-tabs .chip small{font-weight:500;font-size:11.5px;opacity:.7}
.orow{cursor:pointer}
.orow .o-cov{position:relative;width:46px;height:46px}
.orow .o-cov .ic{position:absolute;inset:0;margin:auto;color:#fff;opacity:0;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.orow:hover .o-cov .ic{opacity:1}
.orow.current .r-t{color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
/* online search */
.net{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.net-note{margin:0;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:14px}
.net-note code{font-size:13px;background:var(--hover);padding:1px 6px;border-radius:6px}
.orow{display:grid;grid-template-columns:46px minmax(0,1fr) 52px auto;cursor:pointer;gap:14px;align-items:center;padding:7px 12px;border-radius:14px}
.orow:hover{background:var(--hover)}
.orow img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--hover)}
.orow .btn{height:36px;padding:0 14px;font-size:13px}
.orow .btn[disabled]{opacity:.55;cursor:default}
@media (max-width:760px){.orow{grid-template-columns:46px minmax(0,1fr) auto}.orow .r-d{display:none}}
/* mixer */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.preset{position:relative;text-align:left;padding:14px 16px;border-radius:18px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);transition:background .2s,border-color .2s}
.preset:hover{background:var(--surface-2)}
.preset .sw{width:28px;height:6px;border-radius:3px;background:hsl(var(--ph) 70% 58%);margin-bottom:8px}
.preset b{font:500 16px/1.2 var(--f-display)}
.preset .d{font-size:12px;color:var(--muted);line-height:1.35}
.preset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.p-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0}
.p-del .ic{width:14px;height:14px}
.preset:hover .p-del,.p-del:focus-visible{opacity:1}
.p-del:hover{background:var(--line);color:var(--ink)}
.console{--c-bg:#121626;--c-card:#191E31;--c-line:rgba(255,255,255,.07);--c-ink:#E8EBF4;--c-mute:#8890A6;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;padding:10px;border-radius:28px;background:var(--c-bg);color:var(--c-ink);margin-top:6px}
.c-card{background:var(--c-card);border:1px solid var(--c-line);border-radius:20px;padding:18px;min-width:0}
.c-eq{grid-column:span 8}.c-out{grid-column:span 4}.c-tone{grid-column:span 7}.c-tex{grid-column:span 5}.c-mod{grid-column:span 4}.c-space{grid-column:span 5}.c-move{grid-column:span 3}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.c-head h3{margin:0;font:400 19px/1 var(--f-display)}
.c-note{font-size:12px;color:var(--c-mute)}
.eq-cv{width:100%;height:180px;display:block}
.eq-sliders{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-top:10px}
.eqs{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--c-mute)}
.eqs output{color:var(--c-ink);font-variant-numeric:tabular-nums;min-height:14px}
.eqs input{writing-mode:vertical-lr;direction:rtl;width:24px;height:110px;accent-color:var(--accent);cursor:pointer;margin:0}
.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px 4px}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 0 8px;border-radius:14px}
.knob:hover{background:rgba(255,255,255,.035)}
.knob svg{width:62px;height:62px}
.k-track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4;stroke-linecap:round;stroke-dasharray:122.5 200}
.k-arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.k-cap circle{fill:#272D46}
.k-cap line{stroke:var(--c-ink);stroke-width:2.5;stroke-linecap:round}
.kv{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--c-ink)}
.kl{font-size:11.5px;font-weight:600;color:var(--c-mute);text-align:center}
.knob.dragging .kv{color:var(--accent)}
.meters{display:flex;gap:10px;height:180px;justify-content:center}
.meter{width:16px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;width:100%;height:100%;background:linear-gradient(to top,#3CCB95 0%,#3CCB95 62%,#F0C24B 82%,#FF6A3C 100%);clip-path:inset(100% 0 0 0)}
.m-lab{display:flex;gap:10px;justify-content:center;font-size:11px;color:var(--c-mute);font-weight:600;margin-top:6px}
.m-lab span{width:16px;text-align:center}
.c-read{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0}
.c-read dt{font-size:11.5px;color:var(--c-mute);font-weight:600}
.c-read dd{margin:3px 0 0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* player bar */
.player{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:1408px;margin-inline:auto;height:76px;display:grid;grid-template-columns:minmax(200px,270px) auto minmax(0,1fr) 190px;gap:20px;align-items:center;padding:9px 18px 9px 9px;border-radius:24px;z-index:40;view-transition-name:player}
.p-now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.p-cover{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--hover)}
.p-meta{min-width:0;display:flex;flex-direction:column}
.p-meta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-ctrl{display:flex;align-items:center;gap:2px}
.cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative}
.cbtn:hover{background:var(--hover);color:var(--ink)}
.cbtn .ic{width:19px;height:19px}
.cbtn[aria-pressed="true"],.cbtn.like-on,.cbtn.fx-on{color:var(--accent)}
.cbtn[aria-pressed="true"]::after,.cbtn.fx-on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cbtn .one{position:absolute;top:7px;right:6px;font-size:8px;font-weight:700}
.play-btn{width:48px;height:48px;border-radius:50%;background:var(--deep);color:var(--on-deep);display:grid;place-items:center;margin-inline:4px;position:relative;transition:transform .45s var(--spring)}
.play-btn:hover{transform:scale(1.06)}.play-btn:active{transform:scale(.92)}
.play-btn .ic{width:21px;height:21px;grid-area:1/1}
.gp.loading::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-wave{display:flex;align-items:center;gap:12px;min-width:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wave{flex:1;min-width:0;height:44px;cursor:pointer;touch-action:none;display:block}
.p-vol{display:flex;align-items:center;gap:2px}
.rng{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--v,70%),var(--wave) var(--v,70%));cursor:pointer;margin-left:6px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--glass-strong)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--glass-strong)}
.p-line{display:none}

/* full player */
.full{position:fixed;inset:0;z-index:60;overflow:auto;view-transition-name:full;background:#1d2236;color:#fff}
.full .bg{position:fixed}
.full-inner{position:relative;max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 28px;min-height:100%;display:flex;flex-direction:column;gap:18px}
.full-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.full-top span{font-weight:600;font-size:13px;text-align:center;opacity:.85}
.full-top .grp{display:flex;gap:8px}
.full-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:center}
.f-stage{display:grid;grid-template-columns:minmax(0,min(46vh,400px)) minmax(0,1fr);gap:36px;align-items:center}
.f-cover{width:100%;aspect-ratio:1;border-radius:26px;object-fit:cover;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);transition:transform .7s var(--ease)}
body:not(.is-playing) .f-cover{transform:scale(.94)}
.f-info{min-width:0;display:flex;flex-direction:column;gap:18px}
.f-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.f-title h2{margin:0;font:300 clamp(32px,3.6vw,54px)/1 var(--f-display);letter-spacing:-.035em;overflow-wrap:anywhere}
.f-title p{margin:8px 0 0;font-weight:600;opacity:.8}
.f-wave .wave{height:80px;width:100%}
.f-times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.8;margin-top:6px;font-variant-numeric:tabular-nums}
.f-ctrl{display:flex;align-items:center;justify-content:center;gap:10px}
.full .cbtn{color:#fff}
.full .cbtn:hover{background:rgba(255,255,255,.15)}
.full .cbtn[aria-pressed="true"],.full .cbtn.like-on{color:#fff}
.full .cbtn[aria-pressed="true"]::after{background:#fff}
.f-ctrl .cbtn{width:50px;height:50px}
.f-ctrl .cbtn .ic{width:22px;height:22px}
.f-ctrl .st-play{width:72px;height:72px}
.f-vol{display:flex;align-items:center;gap:6px;opacity:.9}
.full .rng{background:linear-gradient(to right,#fff var(--v,70%),rgba(255,255,255,.28) var(--v,70%))}
.full .rng::-webkit-slider-thumb{background:#fff;border-color:rgba(0,0,0,.2)}
.f-queue{border-radius:26px;padding:16px;max-height:min(70vh,620px);display:flex;flex-direction:column;min-height:0;background:rgba(10,12,22,.28);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1)}
.f-queue h4{margin:0 0 8px;padding-inline:8px;font:400 21px/1 var(--f-display);display:flex;justify-content:space-between;align-items:baseline}
.f-queue h4 small{font:600 12px var(--f-body);opacity:.7}
.q-list{overflow:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.q-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 8px;border-radius:12px;text-align:left}
.q-item:hover{background:rgba(255,255,255,.1)}
.q-item img{width:42px;height:42px;border-radius:9px;object-fit:cover}
.q-item b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item span{display:block;font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item em{font-style:normal;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.q-item.current{background:rgba(255,255,255,.14)}
.q-label{font-size:12px;font-weight:600;opacity:.6;padding:12px 8px 4px;margin:0}

/* overlays */
.menu{position:fixed;z-index:80;width:270px;border-radius:18px;padding:6px;display:flex;flex-direction:column;max-height:70vh;overflow:auto;color:var(--ink);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;text-align:left;font-size:13.5px;font-weight:500}
.menu button:hover{background:var(--hover)}
.menu button .ic{width:17px;height:17px;color:var(--muted)}
.menu button em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted)}
.menu .danger,.menu .danger .ic{color:#C9352D}
.menu .danger.armed{background:#C9352D;color:#fff}.menu .danger.armed .ic{color:#fff}
.m-head{display:flex;gap:10px;align-items:center;padding:6px 8px 8px}
.m-head img{width:38px;height:38px;border-radius:9px;object-fit:cover}
.m-head b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.m-head span{font-size:12px;color:var(--muted)}
.m-sep{height:1px;background:var(--line);margin:5px 4px}
.m-label{margin:4px 12px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.modal-bg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(10,13,20,.4)}
.modal{width:min(420px,100%);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .25s var(--ease)}
.modal h3{margin:0;font:400 24px/1.1 var(--f-display)}
.modal input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--hover);padding:0 14px;font-size:15px;font-weight:600;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .row-btns{display:flex;gap:10px;justify-content:flex-end}
.drop{position:fixed;inset:12px;z-index:95;border-radius:32px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;text-align:center;pointer-events:none}
.drop h3{margin:12px 0 4px;font:300 40px/1 var(--f-display);letter-spacing:-.03em}
.drop p{margin:0;color:var(--muted)}
.drop .ic{width:48px;height:48px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;padding:11px 16px;border-radius:14px;background:var(--deep);color:var(--on-deep);font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);animation:toastIn .35s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.tabbar{display:none}

/* motion: one owner per element, no stacking */
.boot .st-title,.boot .st-artist,.boot .st-meta,.boot .st-kick{animation:rise .9s var(--ease) both}
.boot .st-artist{animation-delay:.08s}.boot .st-meta{animation-delay:.14s}
.boot .st-cover{animation:coverIn 1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes coverIn{from{opacity:0;transform:scale(.92)}}
::view-transition-old(root){animation:vtOut .18s ease both}
::view-transition-new(root){animation:vtIn .42s var(--ease) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
::view-transition-new(full){animation:fullIn .55s var(--ease) both}
::view-transition-old(full){animation:fullOut .3s ease-in both}
@keyframes fullIn{from{opacity:0;transform:translateY(6%)}}
@keyframes fullOut{to{opacity:0;transform:translateY(5%)}}
